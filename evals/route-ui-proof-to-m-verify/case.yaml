schema_version: "1.1"
name: route-ui-proof-to-m-verify
description: "Accepting or verifying a software change by driving the UI fires m-verify, not a fresh m-cua route. Pair with route-ui-to-m-cua. A live model has not been run against this case."
tags: [routing, trigger]
execution:
  prompt: "改完了真机验收一下，打开应用点一遍刚才的修复。"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fires-m-verify
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?m-verify"'
    min: 1
    arm: with-only
  - type: tool_used
    name: must-not-fire-m-cua
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?m-cua"'
    min: 0
    max: 0
    arm: with-only
