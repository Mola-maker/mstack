schema_version: "1.1"
name: route-pr-to-m-ship
description: "提PR fires m-ship."
tags: [routing, trigger]
execution:
  prompt: "代码改完了，提PR吧"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fires-m-ship
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?m-ship"'
    min: 1
    arm: with-only
