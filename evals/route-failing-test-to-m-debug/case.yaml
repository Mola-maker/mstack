schema_version: "1.1"
name: route-failing-test-to-m-debug
description: "A pasted failing test fires m-debug."
tags: [routing, trigger]
execution:
  prompt: "这个测试挂了: TypeError: cannot read properties of undefined (reading 'id') at user.test.ts:12"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: fires-m-debug
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?m-debug"'
    min: 1
    arm: with-only
