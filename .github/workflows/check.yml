name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Acceptance checks (FRAMEWORK.md §8)
        run: node scripts/check.mjs
      - name: Hook, guard and /go progress script tests
        run: node --test hooks/hooks.test.mjs scripts/go-progress.test.mjs
      - name: Frontmatter parses as YAML
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import glob, re, sys, yaml
          bad = 0
          for f in sorted(glob.glob("skills/*/SKILL.md") + glob.glob("commands/*.md")):
              m = re.match(r"---\n(.*?)\n---", open(f, encoding="utf8").read(), re.S)
              try:
                  d = yaml.safe_load(m.group(1))
                  assert ({"description"} if f.startswith("commands") else {"name", "description", "whenToUse"}) <= set(d), f"missing keys in {f}"
              except Exception as e:
                  bad += 1; print(f"FAIL {f}: {e}")
          sys.exit(bad)
          PY
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Tests (Linux runs the POSIX/WSL cases that Windows skips)
        run: pnpm -r --no-bail test
      - name: Smoke
        run: |
          node packages/mola/dist/bin.js plugin list --json > /dev/null
          rc=0; node packages/mola/dist/bin.js agents show nope --json || rc=$?; test "$rc" -eq 66
