# DSH overlay for the "operate" role: dsh --profile <profile> --patch <this file> "<task>"
# It declares the role group itself, so it works even when the profile's own model list does not show it.
# Needs MAGPIE_GATEWAY_KEY in the environment (the same variable the mola-cli profile uses).
- id: llm-pi-ai
  config:
    providers:
      magpie:
        displayName: Magpie
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3425/v1
        models:
          - id: group/m-operate
            name: operate role group
            contextWindow: 1000000
            maxTokens: 32000
            input: [text, image]
- id: agent-default-model
  config:
    provider: magpie
    model: group/m-operate
